name: Actualizar maestro Falabella

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-maestro-falabella
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar productos Falabella
        env:
          FALABELLA_USER_ID: ${{ secrets.FALABELLA_USER_ID }}
          FALABELLA_API_KEY: ${{ secrets.FALABELLA_API_KEY }}
          FALABELLA_BASE_URL: ${{ secrets.FALABELLA_BASE_URL }}
        run: node .github/scripts/sync-falabella.mjs

      - name: Publicar maestro actualizado
        run: |
          if git diff --quiet -- public/maestro.json; then
            echo "El maestro no tuvo cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maestro.json
          git commit -m "Actualizar maestro Falabella"
          git push
